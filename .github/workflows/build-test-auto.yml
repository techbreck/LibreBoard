name: Test build
# builds only for a single abi and does not produce an APK

on:
# disabled on push: when I push to non-main, I do a PR anyway
#  push:
    # don't run on main. I noticed I often don't push commits to avoid unnecessary workflow runs
#    branches-ignore: [ main ]
#    paths:
#      - 'app/**'
  pull_request:
    paths:
      - 'app/**'
      - 'models/**'
      - 'tools/**'
      - '.github/workflows/build-test-auto.yml'
  workflow_dispatch:

jobs:
  build:

    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - uses: gradle/actions/setup-gradle@v3

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build with Gradle
        run: ./gradlew testRunTestsUnitTest assembleDebugNoMinifyAndroidTest --max-workers=1

      - name: Test Phase 0 evaluation gate
        run: python3 -m unittest discover -s tools/tests

      - name: Enforce privacy and GrapheneOS source gates
        run: python3 tools/verify_release.py --source

      - name: Archive reports for failed job
        uses: actions/upload-artifact@v4
        with:
          name: reports
          path: '*/build/reports'
        if: ${{ failure() }}

  model-toolchain-smoke:

    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Set up uv
        uses: astral-sh/setup-uv@v6
        with:
          version: '0.11.4'
          enable-cache: true

      - name: Install hash-locked swipe and context model toolchain
        run: |
          uv venv --python 3.11 build/model-venv
          uv pip install --python build/model-venv/bin/python \
            --require-hashes --torch-backend cpu \
            -r models/training/requirements-context-linux-x86_64.lock

      - name: Smoke-test swipe/context training contracts and ONNX export
        run: build/model-venv/bin/python -m unittest discover -s tools/tests
