name: LibreBoard verification

on:
  pull_request:
    paths:
      - '.github/workflows/**'
      - 'app/**'
      - 'fastlane/**'
      - 'modelpack-en-de/**'
      - 'models/**'
      - 'runtime/**'
      - 'gradle/**'
      - 'third_party/onnxruntime'
      - 'tools/**'
      - 'build.gradle.kts'
      - 'settings.gradle'
      - 'gradle.properties'
      - 'gradlew'
      - 'gradlew.bat'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:

    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - uses: gradle/actions/setup-gradle@v3

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build with Gradle
        run: ./gradlew testRunTestsUnitTest assembleDebugNoMinifyAndroidTest --max-workers=1

      - name: Build core release with strict dependency verification
        run: ./gradlew :app:assembleRelease --max-workers=1 --dependency-verification strict

      - name: Verify core release APK
        run: python3 tools/verify_release.py --apk app/build/outputs/apk/release/LibreBoard_0.1.0-alpha01-release.apk

      - name: Test Phase 0 evaluation gate
        run: python3 -m unittest discover -s tools/tests

      - name: Enforce privacy and GrapheneOS source gates
        run: python3 tools/verify_release.py --source

      - name: Archive reports for failed job
        uses: actions/upload-artifact@v4
        with:
          name: reports
          path: '*/build/reports'
        if: ${{ failure() }}

  model-toolchain-smoke:

    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Set up uv
        uses: astral-sh/setup-uv@v6
        with:
          version: '0.11.4'
          enable-cache: true

      - name: Install minimal hash-locked swipe model toolchain
        run: |
          uv venv --python 3.11 build/model-venv
          uv pip install --python build/model-venv/bin/python \
            --require-hashes --torch-backend cpu \
            -r models/training/requirements-linux-x86_64.lock

      - name: Exercise swipe training and export without context extras
        run: |
          build/model-venv/bin/python -m unittest discover -s tools/tests -p test_train_swipe_model.py
          build/model-venv/bin/python -m unittest discover -s tools/tests -p test_export_swipe_model.py

      - name: Install hash-locked context model toolchain
        run: |
          uv pip install --python build/model-venv/bin/python \
            --require-hashes --torch-backend cpu \
            -r models/training/requirements-context-linux-x86_64.lock

      - name: Smoke-test swipe/context training contracts and ONNX export
        run: build/model-venv/bin/python -m unittest discover -s tools/tests
